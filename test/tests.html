<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uji Engine Kalkulator</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 32px 20px 48px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a1020;
      color: #e8eefc;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p.lead { margin: 0 0 20px; color: #93a4c6; font-size: 14px; }
    #summary {
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(46, 160, 94, 0.16);
      border: 1px solid rgba(72, 200, 130, 0.35);
      font-weight: 600;
      margin-bottom: 16px;
    }
    #summary.is-bad {
      background: rgba(200, 60, 80, 0.16);
      border-color: rgba(255, 110, 130, 0.45);
      color: #ffd2d8;
    }
    ul#results { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .test {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(28, 39, 64, 0.8);
      font-size: 14px;
    }
    .test--fail { background: rgba(120, 32, 48, 0.55); }
    .test__mark { font-weight: 700; }
    .test--pass .test__mark { color: #5ce08f; }
    .test--fail .test__mark { color: #ff8b98; }
    .test__detail {
      flex-basis: 100%;
      margin: 2px 0 0;
      padding-left: 22px;
      color: #ffc2ca;
      font-size: 13px;
      font-family: Consolas, 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Uji Engine Kalkulator</h1>
    <p class="lead">Halaman ini menjalankan seluruh uji perhitungan dari <code>test/engine.test.js</code>.</p>
    <div id="summary">Menjalankan uji…</div>
    <ul id="results"></ul>
  </div>

  <script src="../js/engine.js"></script>
  <script src="./engine.test.js"></script>
</body>
</html>
